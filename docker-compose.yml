services:
  postgres:
    image: postgres:16-alpine
    container_name: atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-atlas} -d ${POSTGRES_DB:-atlas}',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - atlas-network

  redis:
    image: redis:7-alpine
    container_name: atlas-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - atlas-network

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: atlas-cloudbeaver
    restart: unless-stopped
    ports:
      - '${CLOUDBEAVER_PORT:-8978}:8978'
    volumes:
      - cloudbeaver-data:/opt/cloudbeaver/workspace
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - atlas-network

  # ============================================
  # Atlas API Service
  # ============================================
  api:
    image: limitify/atlas-api:latest
    container_name: atlas-api
    restart: unless-stopped
    environment:
      # Application
      PORT: ${PORT:-4000}
      NODE_ENV: ${NODE_ENV:-production}

      # Database - Use your external PostgreSQL connection string
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas}@postgres:5432/${POSTGRES_DB:-atlas}?schema=public}

      # Supabase
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}

      # Redis
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}

      # Optional: JWT Configuration
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-900}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-604800}

    # Load environment variables from .env file
    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    # Health check
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:4000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Logging
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    # Networks
    networks:
      - atlas-network

  # ============================================
  # Background Worker (BullMQ) — processes the `push-notifications` queue.
  # Without this, chat/event/announcement pushes are enqueued but never sent.
  # Same image as `api`; only the `api` role runs migrations.
  # ============================================
  worker:
    image: limitify/atlas-api:latest
    container_name: atlas-worker
    restart: unless-stopped
    command: ['./docker-entrypoint.sh', 'worker']
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas}@postgres:5432/${POSTGRES_DB:-atlas}?schema=public}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-900}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-604800}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - atlas-network

  # ============================================
  # Caddy — reverse proxy / TLS termination in front of the API.
  # See ./Caddyfile — currently plain HTTP on :80 (no domain yet, so no
  # automatic Let's Encrypt cert); switch it to a real domain once atlas.ui
  # has one and Caddy will provision HTTPS automatically.
  # ============================================
  caddy:
    image: caddy:2-alpine
    container_name: atlas-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    networks:
      - atlas-network

volumes:
  postgres-data:
  redis-data:
  cloudbeaver-data:
  caddy-data:
  caddy-config:

# ============================================
# Networks
# ============================================
networks:
  atlas-network:
    driver: bridge
